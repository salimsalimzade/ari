packages:
  - apps/*
  - shared/*

# Single version policy: every external dependency's version is set once here, and each
# package.json asks for it with "catalog:". In strict mode `pnpm add` adds a new package here and
# rejects a version that doesn't match the catalog.
catalogMode: strict
catalog:
  '@biomejs/biome': 2.5.15
  '@kobalte/core': 0.13.14
  '@solidjs/meta': 0.29.4
  '@solidjs/router': 1.0.0
  '@solidjs/start': 2.0.5
  '@tanstack/solid-form': 1.33.5
  '@tesseract.js-data/aze': 1.0.0
  '@tesseract.js-data/eng': 1.0.0
  '@tesseract.js-data/rus': 1.0.0
  '@tesseract.js-data/tur': 1.0.0
  '@types/node': 24.19.2
  '@wxt-dev/module-solid': 1.1.4
  date-fns: 4.4.0
  jsdom: 30.1.1
  lefthook: 2.1.16
  nitro: 3.0.260903-beta
  openapi-typescript: 7.13.0
  sass: 1.105.1
  solid-js: 1.9.15
  tesseract.js: 7.0.0
  tesseract.js-core: 7.0.0
  turbo: 2.11.7
  typescript: 6.0.3
  valibot: 1.5.0
  vite: 8.3.2
  vite-plugin-solid: 2.11.14
  vitest: 5.0.3
  web-ext: 10.7.0
  wxt: 0.21.4

# pnpm 11 runs dependency install scripts only for packages listed here.
allowBuilds:
  # Optional sass dependency, used only by the sass CLI's --watch; Vite doesn't need it.
  '@parcel/watcher': false
  lefthook: true
  # Its postinstall only asks for donations.
  tesseract.js: false
